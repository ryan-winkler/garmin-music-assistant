name: Music Assistant Provider CI & Release

on:
  push:
    branches: [main]
    paths:
      - "providers/garmin_controller/**"
      - "tests/**"
      - "docs/protocol/**"
      - "pyproject.toml"
      - ".github/workflows/provider.yml"
    tags:
      - "provider-v*"
  pull_request:
    paths:
      - "providers/garmin_controller/**"
      - "tests/**"
      - "docs/protocol/**"
      - "pyproject.toml"
      - ".github/workflows/provider.yml"
  schedule:
    # Weekly drift check against upstream Music Assistant community-catalog rules.
    - cron: "0 4 * * 1"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run codespell
      - run: uv run pytest -v

  catalog-check:
    uses: music-assistant/community-catalog/.github/workflows/check-provider.yml@main
    with:
      folder: providers/garmin_controller
      server-line: nightly

  release:
    if: startsWith(github.ref, 'refs/tags/provider-v')
    needs: [test-and-lint, catalog-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Provider GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
