[project]
name = "garmin-music-assistant"
version = "0.1.0"
description = "Garmin Connect IQ controller watch app and Music Assistant community plugin"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "aiohttp>=3.11.0",
  "codespell>=2.3.0",
  "jsonschema>=4.23.0",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-aiohttp>=1.0.5",
  "pytest-timeout>=2.3.1",
  "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
timeout = 60

[tool.mypy]
platform = "linux"
python_version = "3.12"
explicit_package_bases = true
files = ["providers/garmin_controller", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["D213"]
ignore = [
  "ANN401",
  "ARG002",
  "COM812",
  "CPY001",
  "D203",
  "D417",
  "E501",
  "EM101",
  "EM102",
  "PLR2004",
  "S101",
  "TC001",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.codespell]
skip = "uv.lock,LICENSE,garmin-app/bin"
